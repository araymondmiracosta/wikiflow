<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WikiFlow</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/%3E%3Cpath d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/%3E%3C/svg%3E">
    
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; overscroll-behavior-y: none; transition: background-color 0.3s, color 0.3s;
        }

        body.light-theme { background-color: #f3f4f6; color: #111827; }

        #feed-container {
            height: 100vh; height: 100dvh; width: 100vw;
            overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth;
            -ms-overflow-style: none; scrollbar-width: none; position: relative;
            overflow-anchor: none;
        }
        #feed-container::-webkit-scrollbar { display: none; }

        /* Unified Header Navigation (Prevents Stacking & Collisions) */
        #main-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px; z-index: 9999; pointer-events: none;
            transition: padding 0.2s ease;
        }

        #app-header {
            pointer-events: auto;
            display: flex; align-items: center; gap: 10px;
            font-size: 1.25rem; font-weight: 800; font-family: Georgia, serif;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8); white-space: nowrap; transition: 0.3s;
        }
        body.light-theme #app-header { text-shadow: 0 2px 8px rgba(255,255,255,0.8); color: #111827; }
        
        .app-logo {
            width: 26px; height: 26px; color: #3b82f6; flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        #top-actions {
            pointer-events: auto;
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .header-btn {
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px 14px; border-radius: 9999px;
            font-size: 13px; font-weight: 600; cursor: pointer; backdrop-filter: blur(12px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.2s;
            display: flex; align-items: center; gap: 7px;
        }
        body.light-theme .header-btn {
            background: rgba(255,255,255,0.88); color: #111827; border-color: rgba(0,0,0,0.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .header-btn:hover { background: rgba(255,255,255,0.22); transform: translateY(-1px); }
        body.light-theme .header-btn:hover { background: #ffffff; }
        .header-btn svg { width: 16px; height: 16px; stroke-width: 2.2; flex-shrink: 0; }

        /* Prominent Loading Indicator */
        #loading-overlay {
            position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
            z-index: 10005;
            display: none; align-items: center; gap: 10px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 22px; border-radius: 9999px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), 0 0 20px rgba(59, 130, 246, 0.45);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            font-size: 13px; font-weight: 600; color: #fff;
            pointer-events: none; transition: opacity 0.2s ease;
        }
        body.light-theme #loading-overlay {
            background: rgba(255, 255, 255, 0.96);
            border-color: rgba(0, 0, 0, 0.15);
            color: #0f172a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15), 0 0 20px rgba(59, 130, 246, 0.3);
        }
        .loading-spinner {
            width: 16px; height: 16px; animation: spin 0.8s linear infinite; flex-shrink: 0; color: #3b82f6;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .spinner-track { opacity: 0.25; }
        .spinner-head { opacity: 1; }

        /* Search Overlay & Dropdown */
        #search-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 10000; backdrop-filter: blur(6px); padding: 20px;
        }
        #search-container {
            width: 100%; max-width: 520px; margin: 10px auto 0 auto;
            display: flex; flex-direction: column; position: relative;
        }
        #search-input-wrapper {
            display: flex; align-items: center; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255,255,255,0.25); border-radius: 14px;
            padding: 8px 14px; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        body.light-theme #search-input-wrapper {
            background: rgba(255, 255, 255, 0.98); border-color: rgba(0,0,0,0.15);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .search-input-icon { width: 18px; height: 18px; color: #9ca3af; flex-shrink: 0; }
        #wiki-search-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #fff; font-size: 16px; font-family: inherit;
        }
        body.light-theme #wiki-search-input { color: #111827; }
        #wiki-search-input::placeholder { color: #9ca3af; }
        .clear-input-btn {
            background: none; border: none; color: #9ca3af; font-size: 1.3rem;
            cursor: pointer; padding: 0 4px; line-height: 1;
        }
        .close-search-btn {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        body.light-theme .close-search-btn { background: rgba(0,0,0,0.06); color: #111827; }
        .close-search-btn:hover { background: rgba(255,255,255,0.2); }
        body.light-theme .close-search-btn:hover { background: rgba(0,0,0,0.12); }

        #search-suggestions {
            margin-top: 8px; background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 14px;
            overflow: hidden; max-height: 60vh; overflow-y: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        body.light-theme #search-suggestions {
            background: rgba(255, 255, 255, 0.98); border-color: rgba(0,0,0,0.12);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        .suggestion-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px;
            cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06);
            transition: background 0.15s;
        }
        body.light-theme .suggestion-item { border-bottom-color: rgba(0,0,0,0.05); }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover, .suggestion-item:active { background: rgba(255,255,255,0.08); }
        body.light-theme .suggestion-item:hover, body.light-theme .suggestion-item:active { background: rgba(0,0,0,0.04); }
        .suggestion-thumb {
            width: 44px; height: 44px; border-radius: 8px; object-fit: cover;
            background: #1e293b; flex-shrink: 0; display: flex; align-items: center;
            justify-content: center; overflow: hidden;
        }
        body.light-theme .suggestion-thumb { background: #e5e7eb; }
        .suggestion-thumb-placeholder { width: 22px; height: 22px; color: #64748b; }
        .suggestion-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .suggestion-title { font-weight: 600; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        body.light-theme .suggestion-title { color: #111827; }
        .suggestion-desc { font-size: 12px; color: #9ca3af; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        body.light-theme .suggestion-desc { color: #6b7280; }

        /* Article Card Layout: Vertically & Horizontally Centered by Default */
        .article-card {
            height: 100vh; height: 100dvh; width: 100vw;
            scroll-snap-align: start; scroll-snap-stop: always; position: relative;
            display: flex; flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .article-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, hsl(var(--article-h, 0), var(--article-s, 0%), 15%) 0%, hsl(var(--article-h, 0), var(--article-s, 0%), 5%) 100%);
            z-index: 1; transition: background 0.8s ease-in-out;
        }
        body.light-theme .article-bg {
            background: linear-gradient(180deg, hsl(var(--article-h, 0), var(--article-s, 0%), 90%) 0%, hsl(var(--article-h, 0), var(--article-s, 0%), 98%) 100%);
        }

        .article-content {
            position: relative; z-index: 10;
            padding: 72px 24px 32px 24px;
            width: 100%; max-width: 760px; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .title-font { font-family: Georgia, "Times New Roman", serif; }
        .text-shadow { text-shadow: 0px 2px 6px rgba(0,0,0,0.9); transition: 0.3s; }
        body.light-theme .text-shadow { text-shadow: 0px 2px 6px rgba(255,255,255,0.9); }

        .article-title {
            font-size: 1.85rem; font-weight: bold; margin-bottom: 0.85rem; line-height: 1.25; color: #fff;
            max-width: 90%; word-wrap: break-word; transition: 0.3s;
        }
        body.light-theme .article-title { color: #111827; }

        .article-extract {
            font-size: 1rem; margin-bottom: 1rem; color: #e5e7eb; max-width: 92%;
            line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; transition: 0.3s;
        }
        body.light-theme .article-extract { color: #374151; }

        /* Uniform Responsive Image Frames (Consistent Box Sizing) */
        .article-img {
            border: 4px solid rgba(255,255,255,0.9);
            border-radius: 0.85rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.45);
            margin-bottom: 1.25rem;
            object-fit: cover;
            background: #111827;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.3s;
            -webkit-tap-highlight-color: transparent;
            display: block;
        }
        .article-img:hover {
            transform: scale(1.02);
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.6);
        }
        .article-img:active {
            transform: scale(0.97);
        }
        body.light-theme .article-img {
            border-color: rgba(255,255,255,0.95);
            background: #f3f4f6;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.18);
        }

        /* Desktop Uniform Frame Sizes (Bigger & Cleanly Proportionate) */
        .article-img.landscape {
            width: min(85vw, 480px);
            height: 270px;
        }
        .article-img.portrait {
            width: 250px;
            height: 330px;
        }
        .article-img:not(.landscape):not(.portrait) {
            width: min(85vw, 460px);
            height: 270px;
        }

        /* Editorial Fallback Hero (Matches Uniform Dimensions) */
        .article-fallback-hero {
            position: relative;
            width: min(85vw, 460px);
            height: 175px;
            margin-bottom: 1.25rem;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.02) 100%);
            border: 1px solid rgba(255,255,255,0.18);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .article-fallback-hero:hover {
            transform: scale(1.02);
            box-shadow: 0 25px 50px -10px rgba(0,0,0,0.6);
        }
        .article-fallback-hero:active {
            transform: scale(0.97);
        }
        body.light-theme .article-fallback-hero {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.65) 100%);
            border-color: rgba(0,0,0,0.08);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.09), inset 0 1px 0 rgba(255,255,255,0.8);
        }
        .fallback-hero-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, hsl(var(--article-h, 210), 65%, 50%, 0.3) 0%, transparent 70%);
            pointer-events: none;
        }
        .fallback-hero-badge {
            position: absolute;
            top: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 3px 12px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            color: #e2e8f0;
            max-width: 85%;
        }
        body.light-theme .fallback-hero-badge {
            background: rgba(255,255,255,0.75);
            border-color: rgba(0,0,0,0.08);
            color: #475569;
        }
        .fallback-hero-initial {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            color: rgba(255,255,255,0.92);
            text-shadow: 0 4px 18px rgba(0,0,0,0.5);
            margin-top: 18px;
        }
        body.light-theme .fallback-hero-initial {
            color: #1e293b;
            text-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .article-card.has-image .article-fallback-hero {
            display: none;
        }
        .article-card.no-image .article-fallback-hero {
            display: flex;
        }

        /* "Hide Pictures" Mode */
        body.hide-images .article-img {
            display: none !important;
        }
        body.hide-images .article-card.has-image .article-fallback-hero {
            display: flex !important;
        }

        #scroll-trigger { height: 10px; width: 100%; background: transparent; }

        /* Settings Modal */
        #settings-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; backdrop-filter: blur(5px); }
        #settings-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85vw; max-width: 340px;
            background: rgba(15,23,42,0.95); border: 1px solid rgba(255,255,255,0.15); padding: 24px; border-radius: 20px;
            display: flex; flex-direction: column; gap: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); transition: 0.3s;
        }
        body.light-theme #settings-modal { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.1); color: #111827; }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 1.25rem; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; transition: 0.3s; }
        body.light-theme .modal-header { border-color: rgba(0,0,0,0.1); }
        
        .close-btn { background: none; border: none; color: #9ca3af; font-size: 1.5rem; cursor: pointer; padding: 0; line-height: 1; transition: 0.3s; }
        body.light-theme .close-btn { color: #6b7280; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; font-size: 1.05rem; font-weight: 500; }

        .switch { position: relative; display: inline-block; width: 50px; height: 28px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4b5563; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #3b82f6; }
        input:checked + .slider:before { transform: translateX(22px); }

        .modal-divider { border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 0; transition: 0.3s; }
        body.light-theme .modal-divider { border-color: rgba(0,0,0,0.1); }
        
        .about-text { text-align: center; font-size: 0.85rem; color: #9ca3af; line-height: 1.4; transition: 0.3s; }
        body.light-theme .about-text { color: #6b7280; }

        /* Debug Stats Panel */
        #debug-panel {
            position: fixed; z-index: 9998;
            background: rgba(15, 23, 42, 0.88); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px; border-radius: 14px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            flex-direction: column; transition: 0.3s;
        }
        body.light-theme #debug-panel { background: rgba(255,255,255,0.95); border-color: rgba(0,0,0,0.1); color: #111827; }
        
        #debug-panel h3 { font-weight: bold; margin-top: 0; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 4px; font-size: 13px; transition: 0.3s; }
        body.light-theme #debug-panel h3 { border-color: rgba(0,0,0,0.1); }
        
        .stat-list-container { overflow-y: auto; margin-bottom: 10px; padding-right: 5px; }
        .stat-list-container::-webkit-scrollbar { width: 4px; }
        .stat-list-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
        .stat-list-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        body.light-theme .stat-list-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        body.light-theme .stat-list-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); }

        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 3px; font-size: 12px; transition: 0.3s; }
        body.light-theme .stat-row { border-color: rgba(0,0,0,0.1); }
        
        .stat-name-container { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; padding-right: 8px; }
        
        .delete-btn {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #ef4444;
            cursor: pointer;
            width: 28px;
            height: 28px;
            min-width: 28px;
            min-height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            padding: 0;
            transition: all 0.2s ease;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.5);
            color: #f87171;
            transform: scale(1.06);
        }
        .delete-btn:active {
            transform: scale(0.92);
            background: rgba(239, 68, 68, 0.35);
        }
        body.light-theme .delete-btn {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.2);
            color: #dc2626;
        }
        
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .text-green { color: #4ade80; font-weight: bold; }
        body.light-theme .text-green { color: #16a34a; }

        #clear-stats-btn {
            width: 100%;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #e2e8f0;
            border-radius: 9999px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            backdrop-filter: blur(8px);
            margin-top: 3px;
        }
        #clear-stats-btn:hover {
            background: rgba(239, 68, 68, 0.18);
            border-color: rgba(239, 68, 68, 0.45);
            color: #fca5a5;
            transform: translateY(-1px);
        }
        #clear-stats-btn:active {
            transform: scale(0.97);
        }
        body.light-theme #clear-stats-btn {
            background: rgba(0, 0, 0, 0.04);
            border-color: rgba(0, 0, 0, 0.12);
            color: #334155;
        }
        body.light-theme #clear-stats-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: #dc2626;
        }

        .reason-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.18); font-size: 11px; line-height: 1.4; transition: 0.3s; }
        body.light-theme .reason-box { border-color: rgba(0,0,0,0.1); }
        .reason-title { font-weight: bold; color: #fff; margin-bottom: 3px; transition: 0.3s; }
        body.light-theme .reason-title { color: #111827; }
        .reason-text { color: #9ca3af; font-style: italic; transition: 0.3s; }
        body.light-theme .reason-text { color: #4b5563; }

        /* Desktop Positioning */
        @media (min-width: 769px) {
            .article-card { justify-content: center; }
            .article-content { padding: 80px 32px 40px 32px; max-width: 820px; }
            .article-title { font-size: 3rem; }
            .article-extract { font-size: 1.15rem; }

            #debug-panel {
                top: 75px; right: 24px; left: auto; transform: none;
                width: 285px; max-height: 55vh;
            }
            .stat-list-container { max-height: 28vh; }
        }

        /* Mobile Responsive Layout & Safe Boundaries */
        @media (max-width: 768px) {
            #main-nav {
                padding: 12px 18px;
            }

            /* Standard Centered Card */
            .article-card {
                justify-content: center;
            }
            .article-content {
                padding: 64px 22px 32px 22px;
                max-width: 100%;
            }
            .article-img.landscape {
                width: min(88vw, 320px);
                height: 180px;
                margin-bottom: 1.1rem;
            }

    <script>
        // =========================================================================
        // WIKIFLOW CONFIGURATION & TUNABLE PARAMETERS
        // =========================================================================
        const CONFIG = {
            API_URL: 'https://en.wikipedia.org/w/api.php',

            // Points Allocation & Fixed Budget
            TOTAL_POINTS_BUDGET: 500,           // Strict point budget across entire profile
            CATEGORY_SCORE_MAX: 120,            // Score cap on single categories
            POINTS_READ_CLICK: 50,              // Points awarded on article click
            POINTS_SEARCH_SELECT: 100,          // Points awarded on search selection
            POINTS_DWELL_TICK: 2.0,             // Points awarded per active 500ms tick after threshold
            POINTS_DWELL_LONG_TICK: 0.25,       // Diminished points per tick for long dwell (> 15s)

            // Topic Fatigue & Consecutive Skips
            FATIGUE_CONSECUTIVE_SKIPS: 2,        // Consecutive quick skips of the same topic before fatigue triggers
            FATIGUE_PENALTY_POINTS: 15,         // Points deducted from fatigued topic (floor at 0)
            FATIGUE_COOLDOWN_CARDS: 6,          // How many feed cards the fatigued topic is put on timeout for

            // Gradual Zero-Floor Decay
            INACTIVE_DECAY_RATE: 0.985,         // Natural decay applied to unengaged categories
            MIN_SCORE_THRESHOLD: 0.5,           // Categories falling below this decline to 0 and are dropped

            // Dwell & Skip Timings
            DWELL_MIN_ACTIVE_SEC: 4.5,          // Must actively view article for at least 4.5s before points add
            DWELL_TICK_INTERVAL_MS: 500,        // Active dwell calculation interval
            DWELL_LONG_THRESHOLD_SEC: 15.0,     // Dwell duration where diminishing returns start
            QUICK_SKIP_THRESHOLD_SEC: 2.5,      // Skips under this duration count toward consecutive skips
            SEARCH_DEBOUNCE_MS: 250,            // Typing delay before live search queries Wikipedia

            // Feed Distribution & Anti-Clustering
            FEED_RATIO_PREFERRED: 3,            // Max preferred-to-discovery ratio when user has diverse interests
            SCORE_MATCH_MULTIPLIER: 2.5,        // Multiplier prioritizing user's top categories
            INTERSECTION_BOOST_EXP: 1.5,        // Multiplier when multiple interests intersect
            THUMBNAIL_SCORE_BONUS: 20,          // Visual tie-breaker bonus
            TOPIC_LIMIT: 25,                    // Maximum distinct topics tracked in profile

            // In-Memory Buffers & Safe Lookahead Zone
            PROTECTED_AHEAD_BUFFER: 3,          // IMMUTABILITY ZONE: Next 3 cards are frozen and never mutate mid-scroll
            DOM_BUFFER_TARGET: 6,               // Cards pre-rendered ahead in DOM (total queue depth)
            POOL_MIN_TRIGGER: 10,               // Candidate pool threshold triggering background replenish
            POOL_TARGET_MAX: 24,                // Maximum candidate pool size in memory
            SEEN_HISTORY_MAX: 50000,            // Maximum seen article IDs kept to prevent duplicates
            SEEN_HISTORY_PRUNE_TO: 25000        // Pruning target when seen history is exceeded
        };

        // --- DOM Elements ---
        const container = document.getElementById('feed-container');
        const trigger = document.getElementById('scroll-trigger');
        const loadingOverlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        
        const menuToggle = document.getElementById('menu-toggle');
        const settingsOverlay = document.getElementById('settings-overlay');
        const closeModalBtn = document.getElementById('close-modal');
        const debugPanel = document.getElementById('debug-panel');
        const statListContainer = document.getElementById('stat-list-container');
        const suggestionReasonText = document.getElementById('suggestion-reason-text');
        const clearStatsBtn = document.getElementById('clear-stats-btn');
        
        const toggleStatsToggle = document.getElementById('toggle-stats');
        const toggleImagesToggle = document.getElementById('toggle-images');
        const toggleThemeToggle = document.getElementById('toggle-theme');

        const searchToggle = document.getElementById('search-toggle');
        const searchOverlay = document.getElementById('search-overlay');
        const closeSearchBtn = document.getElementById('close-search-btn');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const wikiSearchInput = document.getElementById('wiki-search-input');
        const searchSuggestions = document.getElementById('search-suggestions');
        let searchTimeout = null;
        
        // --- Runtime State ---
        let isLoading = false;
        let isReplenishingPool = false;
        let isWaitingAtBottom = false;
        let isWindowFocused = true;
        let dwellInterval = null;
        let activeCategories = [];
        let activeDwellTime = 0;
        let currentActiveCard = null;
        let lastReportedDwellPauseReason = null;
        
        let preferredPool = [];
        let discoveryPool = [];
        
        let consecutiveTopicSkips = {};
        let topicCooldowns = {};

        let seenArticles = new Set(JSON.parse(localStorage.getItem('wikiFlowSeen') || localStorage.getItem('wikiReelsSeen') || '[]'));
        
        let scrollObserver;
        let dwellObserver;

        // --- Category Exclusion Filter ---
        function isIgnoredCategory(cat) {
            if (!cat) return true;
            const c = cat.toLowerCase().trim();
            if (/^(all )?articles (with|containing|needing|lacking|to be|having|using|without|requiring)/.test(c)) return true;
            if (/^pages (using|with|containing|needing|lacking|to be)/.test(c)) return true;
            if (/^wikipedia (articles|pages|stubs|cleanup|maintenance|templates|categories)/.test(c)) return true;
            if (/^use (dmy|mdy|american|british|canadian|australian|standard)/.test(c)) return true;
            if (/\b(cs1|dmy date|mdy date|webarchive|wikidata|short description)\b/.test(c)) return true;
            if (/\b(infobox|navbox|template|disambiguation|redirects|stub)\b/.test(c)) return true;
            if (/^\d{1,4}s? (births|deaths)$/.test(c)) return true;
            if (/^\d{1,2}(st|nd|rd|th)-century (births|deaths)$/.test(c)) return true;
            if (/^(year of|date of) (birth|death)/.test(c)) return true;
            return false;
        }

        // --- Loading Indicator Controls ---
        function showLoading(msg = "Loading...") {
            if (loadingText) loadingText.textContent = msg;
            loadingOverlay.style.display = 'flex';
        }

        function hideLoading() {
            if (!navigator.onLine) {
                showLoading("Offline. Reconnecting...");
                return;
            }
            loadingOverlay.style.display = 'none';
        }

        window.addEventListener('offline', () => {
            console.warn("[WikiFlow] Internet connection lost.");
            showLoading("Offline. Reconnecting...");
        });

        window.addEventListener('online', () => {
            console.log("[WikiFlow] Internet connection restored.");
            hideLoading();
            ensureDOMBuffer();
        });

        // --- Color Extraction Logic ---
        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max == min) { h = s = 0; } 
            else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            return [Math.floor(h * 360), Math.floor(s * 100), Math.floor(l * 100)];
        }

        function extractColorFromImage(url, callback) {
            const img = new Image();
            img.crossOrigin = "Anonymous"; 
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.naturalWidth || img.width || 100; 
                canvas.height = img.naturalHeight || img.height || 100;
                if(canvas.width === 0) return;
                
                try {
                    ctx.drawImage(img, 0, 0);
                    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    let r = 0, g = 0, b = 0, count = 0;
                    
                    for (let i = 0; i < data.length; i += 16) {
                        if (data[i+3] > 128) { 
                            r += data[i]; g += data[i+1]; b += data[i+2];
                            count++;
                        }
                    }
                    if (count > 0) {
                        const hsl = rgbToHsl(r/count, g/count, b/count);
                        callback(hsl);
                    }
                } catch(e) { }
            };
            img.src = url;
        }

        // --- Persistent Settings Logic with Context-Aware Body Class ---
        function updateStatsVisibility(show) {
            document.body.classList.toggle('stats-active', show);
            if (show) {
                debugPanel.style.display = 'flex';
                renderDebug();
            } else {
                debugPanel.style.display = 'none';
            }
        }

        function loadSettings() {
            const settings = JSON.parse(localStorage.getItem('wikiFlowSettings') || localStorage.getItem('wikiReelsSettings') || '{"showStats":false, "hideImages":false, "lightTheme":false}');
            toggleStatsToggle.checked = settings.showStats;
            toggleImagesToggle.checked = settings.hideImages;
            toggleThemeToggle.checked = settings.lightTheme;
            
            updateStatsVisibility(settings.showStats);

            if (settings.hideImages) {
                document.body.classList.add('hide-images');
            }
            if (settings.lightTheme) {
                document.body.classList.add('light-theme');
            }
        }
        
        function saveSettings() {
            const settings = {
                showStats: toggleStatsToggle.checked,
                hideImages: toggleImagesToggle.checked,
                lightTheme: toggleThemeToggle.checked
            };
            localStorage.setItem('wikiFlowSettings', JSON.stringify(settings));
        }

        function toggleMenu() {
            const isHidden = window.getComputedStyle(settingsOverlay).display === 'none';
            settingsOverlay.style.display = isHidden ? 'block' : 'none';
            if (isHidden) {
                console.log("[WikiFlow] Settings menu opened: Dwell paused.");
            } else {
                console.log("[WikiFlow] Settings menu closed: Dwell resumed.");
            }
        }
        
        menuToggle.addEventListener('click', toggleMenu);
        closeModalBtn.addEventListener('click', toggleMenu);
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) toggleMenu();
        });

        toggleStatsToggle.addEventListener('change', (e) => {
            updateStatsVisibility(e.target.checked);
            saveSettings();
        });

        toggleThemeToggle.addEventListener('change', (e) => {
            document.body.classList.toggle('light-theme', e.target.checked);
            saveSettings();
        });

        toggleImagesToggle.addEventListener('change', (e) => {
            document.body.classList.toggle('hide-images', e.target.checked);
            saveSettings();
        });

        window.removeInterest = function(encodedCat) {
            try {
                const cat = decodeURIComponent(encodedCat);
                const profile = getProfile();
                delete profile[cat];
                saveProfile(profile);
                console.log(`[WikiFlow] Interest manually deleted: "${cat}"`);
                renderDebug();
                pruneUpcomingArticles([cat]);
            } catch(e) {}
        };

        // --- Search Functionality ---
        function openSearch() {
            searchOverlay.style.display = 'block';
            wikiSearchInput.focus();
        }
        function closeSearch() {
            searchOverlay.style.display = 'none';
            wikiSearchInput.value = '';
            searchSuggestions.innerHTML = '';
            searchSuggestions.style.display = 'none';
            clearSearchBtn.style.display = 'none';
        }

        searchToggle.addEventListener('click', openSearch);
        closeSearchBtn.addEventListener('click', closeSearch);
        searchOverlay.addEventListener('click', (e) => {
            if (e.target === searchOverlay) closeSearch();
        });
        clearSearchBtn.addEventListener('click', () => {
            wikiSearchInput.value = '';
            searchSuggestions.innerHTML = '';
            searchSuggestions.style.display = 'none';
            clearSearchBtn.style.display = 'none';
            wikiSearchInput.focus();
        });

        wikiSearchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearSearchBtn.style.display = query ? 'block' : 'none';
            if (searchTimeout) clearTimeout(searchTimeout);
            if (!query) {
                searchSuggestions.innerHTML = '';
                searchSuggestions.style.display = 'none';
                return;
            }
            searchTimeout = setTimeout(() => {
                fetchSearchSuggestions(query);
            }, CONFIG.SEARCH_DEBOUNCE_MS);
        });

        async function fetchSearchSuggestions(term) {
            searchSuggestions.style.display = 'block';
            searchSuggestions.innerHTML = '<div style="padding: 14px; font-size: 13px; color: #9ca3af; text-align: center;">Searching Wikipedia...</div>';

            const params = new URLSearchParams({
                action: 'query',
                format: 'json',
                origin: '*',
                generator: 'prefixsearch',
                gpssearch: term,
                gpslimit: '8',
                prop: 'pageimages|description|categories',
                piprop: 'thumbnail',
                pithumbsize: '140',
                pilimit: '8',
                cllimit: '50',
                clshow: '!hidden',
                redirects: '1'
            });

            try {
                const res = await fetch(`${CONFIG.API_URL}?${params.toString()}`);
                const data = await res.json();
                if (!data.query || !data.query.pages) {
                    searchSuggestions.innerHTML = '<div style="padding: 14px; font-size: 13px; color: #9ca3af; text-align: center;">No matching articles found.</div>';
                    return;
                }

                const pages = Object.values(data.query.pages).sort((a, b) => (a.index || 0) - (b.index || 0));
                renderSuggestions(pages);
            } catch(e) {
                searchSuggestions.innerHTML = '<div style="padding: 14px; font-size: 13px; color: #ef4444; text-align: center;">Failed to load suggestions.</div>';
            }
        }

        function renderSuggestions(pages) {
            let html = '';
            pages.forEach((page, idx) => {
                const imgHtml = page.thumbnail 
                    ? `<img src="${page.thumbnail.source}" class="suggestion-thumb" alt="${page.title}">`
                    : `<div class="suggestion-thumb"><svg class="suggestion-thumb-placeholder" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg></div>`;
                
                const desc = page.description || 'Wikipedia article';
                html += `
                    <div class="suggestion-item" data-index="${idx}">
                        ${imgHtml}
                        <div class="suggestion-info">
                            <span class="suggestion-title">${page.title}</span>
                            <span class="suggestion-desc">${desc}</span>
                        </div>
                    </div>
                `;
            });

            searchSuggestions.innerHTML = html;

            const items = searchSuggestions.querySelectorAll('.suggestion-item');
            items.forEach(item => {
                item.addEventListener('click', () => {
                    const idx = item.dataset.index;
                    handleSelectSearchArticle(pages[idx]);
                });
            });
        }

        async function handleSelectSearchArticle(page) {
            console.log(`[WikiFlow] Search article clicked: "${page.title}" (PageID: ${page.pageid})`);
            const url = `https://en.wikipedia.org/?curid=${page.pageid}`;
            window.open(url, '_blank');

            let categories = await getArticleCategories(page.title, page.pageid);
            let cleanCats = categories.map(c => c.replace(/^Category:/i, '').trim()).filter(c => !isIgnoredCategory(c));

            if (cleanCats.length === 0) {
                cleanCats = [page.title.trim()];
            }

            console.log(`[WikiFlow] Search selection bonus (+${CONFIG.POINTS_SEARCH_SELECT}) applied to:`, cleanCats);
            updateCategoryScores(cleanCats, CONFIG.POINTS_SEARCH_SELECT);
            realignFeedAfterPreferenceShift(cleanCats[0]);

            closeSearch();
        }

        async function getArticleCategories(title, pageid) {
            try {
                const params = new URLSearchParams({
                    action: 'query',
                    format: 'json',
                    origin: '*',
                    redirects: '1',
                    prop: 'categories',
                    cllimit: '50',
                    clshow: '!hidden'
                });
                if (title) {
                    params.append('titles', title);
                } else if (pageid) {
                    params.append('pageids', pageid);
                }
                const res = await fetch(`${CONFIG.API_URL}?${params.toString()}`);
                const data = await res.json();
                if (data.query && data.query.pages) {
                    const resolvedPage = Object.values(data.query.pages)[0];
                    if (resolvedPage && resolvedPage.categories) {
                        return resolvedPage.categories.map(c => c.title);
                    }
                }
            } catch(e) {
                console.error("[WikiFlow] Canonical category lookup error:", e);
            }
            return [];
        }

        // --- Real-time Debug Render (Clean Design) ---

        function getProfile() {
            try { 
                return JSON.parse(localStorage.getItem('wikiFlowProfile') || localStorage.getItem('wikiReelsProfile')) || {}; 
            } catch { return {}; }
        }

        function saveProfile(profile) {
            try { localStorage.setItem('wikiFlowProfile', JSON.stringify(profile)); } 
            catch(e) {}
        }

        function getTopCategories(limit = 3) {
            const profile = getProfile();
            return Object.entries(profile)
                .filter(([cat, score]) => score > 0 && !isIgnoredCategory(cat))
                .sort((a, b) => b[1] - a[1])
                .slice(0, limit)
                .map(([cat, score]) => ({ category: cat, score }));
        }

        // --- Category Score Updates with Fixed Point Budget & Natural Decay ---
        function updateCategoryScores(categories, points) {
            if (!categories || categories.length === 0 || points <= 0) return;
            const profile = getProfile();
            const activeSet = new Set(categories.map(c => c.replace(/^Category:/i, '').trim()));
            
            // 1. Award points to engaged categories & reset any skip counters/cooldowns
            activeSet.forEach(cleanCat => {
                if (!isIgnoredCategory(cleanCat)) {
                    profile[cleanCat] = Math.min(CONFIG.CATEGORY_SCORE_MAX, (profile[cleanCat] || 0) + points);
                    delete consecutiveTopicSkips[cleanCat];
                    delete topicCooldowns[cleanCat];
                }
            });
            
            // 2. Natural decay on unengaged topics (scores decline to 0; no negative numbers)
            for (let cat in profile) {
                if (!activeSet.has(cat)) {
                    profile[cat] *= CONFIG.INACTIVE_DECAY_RATE;
                }
                if (profile[cat] <= CONFIG.MIN_SCORE_THRESHOLD) {
                    delete profile[cat];
                }
            }
            
            // 3. Enforce Fixed Total Point Budget across entire profile
            let totalScore = Object.values(profile).reduce((sum, val) => sum + val, 0);
            if (totalScore > CONFIG.TOTAL_POINTS_BUDGET) {
                const excess = totalScore - CONFIG.TOTAL_POINTS_BUDGET;
                const unengagedCats = Object.keys(profile).filter(cat => !activeSet.has(cat));
                const unengagedTotal = unengagedCats.reduce((sum, cat) => sum + profile[cat], 0);
                
                if (unengagedTotal > 0 && excess <= unengagedTotal) {
                    unengagedCats.forEach(cat => {
                        profile[cat] -= excess * (profile[cat] / unengagedTotal);
                        if (profile[cat] <= CONFIG.MIN_SCORE_THRESHOLD) {
                            delete profile[cat];
                        }
                    });
                } else {
                    const scale = CONFIG.TOTAL_POINTS_BUDGET / totalScore;
                    for (let cat in profile) {
                        profile[cat] *= scale;
                        if (profile[cat] <= CONFIG.MIN_SCORE_THRESHOLD) {
                            delete profile[cat];
                        }
                    }
                }
            }

            // 4. Ensure no negative numbers & drop zeroed categories
            for (let cat in profile) {
                if (profile[cat] <= CONFIG.MIN_SCORE_THRESHOLD) {
                    delete profile[cat];
                }
            }

            // 5. Enforce topic count limit
            const sortedKeys = Object.entries(profile).sort((a, b) => b[1] - a[1]);
            if (sortedKeys.length > CONFIG.TOPIC_LIMIT) {
                sortedKeys.slice(CONFIG.TOPIC_LIMIT).forEach(([cat]) => delete profile[cat]);
            }
            
            saveProfile(profile);
            
            if (toggleStatsToggle.checked) {
                renderDebug();
            }
        }

        // --- Fatigue Mitigation: Triggered when user skips consecutive cards of same topic ---
        function applyTopicFatigue(fatiguedCategory) {
            const profile = getProfile();
            if (!profile[fatiguedCategory]) return;

            console.warn(`[WikiFlow] Consecutive skips on "${fatiguedCategory}". Applying fatigue penalty (-${CONFIG.FATIGUE_PENALTY_POINTS} pts) and cooldown.`);
            
            profile[fatiguedCategory] = Math.max(0, profile[fatiguedCategory] - CONFIG.FATIGUE_PENALTY_POINTS);
            if (profile[fatiguedCategory] <= CONFIG.MIN_SCORE_THRESHOLD) {
                delete profile[fatiguedCategory];
            }
            saveProfile(profile);

            topicCooldowns[fatiguedCategory] = CONFIG.FATIGUE_COOLDOWN_CARDS;
            delete consecutiveTopicSkips[fatiguedCategory];

            pruneUpcomingArticles([fatiguedCategory]);

            if (toggleStatsToggle.checked) renderDebug();
        }

        function markArticleSeen(pageid) {
            seenArticles.add(pageid);
            if (seenArticles.size > CONFIG.SEEN_HISTORY_MAX) { 
                seenArticles = new Set(Array.from(seenArticles).slice(-CONFIG.SEEN_HISTORY_PRUNE_TO));
            }
            try { 
                localStorage.setItem('wikiFlowSeen', JSON.stringify(Array.from(seenArticles))); 
            } catch(e) {}
        }

        // --- Recommendation Scoring: Respects Topic Cooldowns & Boosts Preferences ---
        function scoreArticleByIntersection(article, profile, fallbackReason = "Exploration: Broadening your horizons") {
            let score = 0;
            const rawCats = article.categories ? article.categories.map(c => c.title) : [];
            let cleanCats = rawCats.map(c => c.replace(/^Category:/i, '').trim()).filter(c => !isIgnoredCategory(c));
            
            if (article.sourceCategory && !isIgnoredCategory(article.sourceCategory) && !cleanCats.includes(article.sourceCategory)) {
                cleanCats.unshift(article.sourceCategory);
            }

            const isOnCooldown = cleanCats.some(cat => (topicCooldowns[cat] || 0) > 0);
            if (isOnCooldown) {
                score -= 300;
            }

            let matchedInterests = [];
            cleanCats.forEach(cat => {
                if (profile[cat] && profile[cat] > 0) {
                    score += profile[cat] * CONFIG.SCORE_MATCH_MULTIPLIER;
                    matchedInterests.push(cat);
                }
            });

            if (matchedInterests.length > 1) {
                score *= Math.pow(CONFIG.INTERSECTION_BOOST_EXP, matchedInterests.length - 1);
            }

            if (article.thumbnail) {
                score += CONFIG.THUMBNAIL_SCORE_BONUS;
            }

            let reason = article.baseReason || fallbackReason;
            if (matchedInterests.length > 0) {
                const topMatches = matchedInterests.slice(0, 2).join(', ');
                reason = `Matched your interest in: <b>${topMatches}</b>`;
            }

            return { article, score, cleanCats, reason };
        }

        // --- Non-Alphabetical Category Fetching (Random Start Letter + Shuffle) ---
        async function fetchWikiData(params) {
            params.append('origin', '*'); 
            params.append('format', 'json');
            params.append('prop', 'extracts|categories|pageimages');
            params.append('piprop', 'thumbnail'); 
            params.append('pithumbsize', '500'); 
            params.append('exchars', '350'); 
            params.append('exintro', '1');
            params.append('explaintext', '1'); 
            params.append('cllimit', '50');
            params.append('clshow', '!hidden');
            params.append('redirects', '1');

            if (params.get('generator') === 'categorymembers') {
                const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                const randomLetter = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                params.append('gcmstartsortkeyprefix', randomLetter);
                params.append('gcmdir', Math.random() > 0.5 ? 'ascending' : 'descending');
            }

            try {
                const res = await fetch(`${CONFIG.API_URL}?${params.toString()}`);
                const data = await res.json();
                if (!data.query || !data.query.pages) return [];
                
                let pages = Object.values(data.query.pages).filter(page => 
                    page.extract && page.extract.length > 80 &&
                    !page.title.includes('List of') &&
                    !page.extract.includes('may refer to:') &&
                    !seenArticles.has(page.pageid) 
                );

                for (let i = pages.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pages[i], pages[j]] = [pages[j], pages[i]];
                }

                return pages;
            } catch (err) { 
                console.error("[WikiFlow] Wikipedia API Error:", err);
                return []; 
            }
        }

        // --- Split Pool Replenishment: Preferred & Discovery Reservoirs ---
        async function replenishCandidatePool() {
            if (isReplenishingPool) return;
            const totalInPool = preferredPool.length + discoveryPool.length;
            if (totalInPool >= CONFIG.POOL_TARGET_MAX) return;
            
            isReplenishingPool = true;

            try {
                const topCategories = getTopCategories(3);

                if (topCategories.length > 0 && preferredPool.length < 14) {
                    for (const top of topCategories) {
                        if ((topicCooldowns[top.category] || 0) > 0) continue;

                        const params = new URLSearchParams({ 
                            action: 'query', 
                            generator: 'categorymembers', 
                            gcmtitle: `Category:${top.category}`, 
                            gcmnamespace: '0', 
                            gcmlimit: '18' 
                        });
                        const res = await fetchWikiData(params);
                        res.forEach(item => {
                            item.sourceCategory = top.category;
                            item.baseReason = `Based on your interest in: <b>${top.category}</b>`;
                        });
                        
                        const existingIds = new Set([...preferredPool, ...discoveryPool].map(a => a.pageid));
                        const unique = res.filter(item => !seenArticles.has(item.pageid) && !existingIds.has(item.pageid));
                        preferredPool.push(...unique);
                    }
                }

                if (discoveryPool.length < 8) {
                    const featParams = new URLSearchParams({ 
                        action: 'query', 
                        generator: 'categorymembers', 
                        gcmtitle: 'Category:Wikipedia_featured_articles', 
                        gcmnamespace: '0', 
                        gcmlimit: '15' 
                    });
                    const featRes = await fetchWikiData(featParams);
                    featRes.forEach(item => {
                        item.baseReason = "Fresh Content: Popular Featured Article";
                    });

                    const randParams = new URLSearchParams({ 
                        action: 'query', 
                        generator: 'random', 
                        grnnamespace: '0', 
                        grnlimit: '12' 
                    });
                    const randRes = await fetchWikiData(randParams);
                    randRes.forEach(item => {
                        item.baseReason = "Exploration: Broadening your horizons";
                    });

                    const existingIds = new Set([...preferredPool, ...discoveryPool].map(a => a.pageid));
                    const uniqueDiscovery = [...featRes, ...randRes].filter(item => !seenArticles.has(item.pageid) && !existingIds.has(item.pageid));
                    discoveryPool.push(...uniqueDiscovery);
                }

                console.log(`[WikiFlow] Pools topped up: ${preferredPool.length} preferred, ${discoveryPool.length} discovery.`);
            } catch (err) {
                console.error("[WikiFlow] Pool replenishment error:", err);
            } finally {
                isReplenishingPool = false;
            }
        }

        function getUpcomingArticles() {
            if (!currentActiveCard) return [];
            const allCards = Array.from(container.querySelectorAll('.article-card'));
            const currentIndex = allCards.indexOf(currentActiveCard);
            if (currentIndex === -1) return [];
            return allCards.slice(currentIndex + 1);
        }

        function getPrunableUpcomingArticles() {
            if (!currentActiveCard) return [];
            const allCards = Array.from(container.querySelectorAll('.article-card'));
            const currentIndex = allCards.indexOf(currentActiveCard);
            if (currentIndex === -1) return [];
            const safeIndex = currentIndex + 1 + CONFIG.PROTECTED_AHEAD_BUFFER;
            return allCards.slice(safeIndex);
        }

        // --- Dwell Verification ---
        function isUserActivelyReading() {
            if (isWaitingAtBottom) {
                reportDwellPause("User reached end of feed and is waiting for next article");
                return false;
            }
            if (document.hidden) {
                reportDwellPause("Tab/document is hidden");
                return false;
            }
            if (!document.hasFocus() || !isWindowFocused) {
                reportDwellPause("Window or application lost focus");
                return false;
            }
            if (settingsOverlay && window.getComputedStyle(settingsOverlay).display !== 'none') {
                reportDwellPause("Settings menu is currently open");
                return false;
            }
            if (searchOverlay && window.getComputedStyle(searchOverlay).display !== 'none') {
                reportDwellPause("Search modal is currently open");
                return false;
            }
            lastReportedDwellPauseReason = null;
            return true;
        }

        function reportDwellPause(reason) {
            if (lastReportedDwellPauseReason !== reason) {
                console.log(`[WikiFlow] Dwell paused: ${reason}.`);
                lastReportedDwellPauseReason = reason;
            }
        }

        function pruneUpcomingArticles(categoriesToPurge) {
            const prunable = getPrunableUpcomingArticles();
            let purgedCount = 0;
            prunable.forEach(card => {
                try {
                    const cardCats = JSON.parse(card.dataset.categories || '[]');
                    const hasMatch = cardCats.some(cat => categoriesToPurge.includes(cat));
                    if (hasMatch) {
                        dwellObserver.unobserve(card);
                        card.remove();
                        purgedCount++;
                    }
                } catch(e) {}
            });

            preferredPool = preferredPool.filter(art => {
                const rawCats = art.categories ? art.categories.map(c => c.title.replace(/^Category:/i, '').trim()) : [];
                return !rawCats.some(cat => categoriesToPurge.includes(cat));
            });
            discoveryPool = discoveryPool.filter(art => {
                const rawCats = art.categories ? art.categories.map(c => c.title.replace(/^Category:/i, '').trim()) : [];
                return !rawCats.some(cat => categoriesToPurge.includes(cat));
            });

            if (purgedCount > 0) {
                console.log(`[WikiFlow] Pruned ${purgedCount} deep upcoming article(s) matching:`, categoriesToPurge);
            }
            ensureDOMBuffer();
        }

        function purgeAllUpcomingArticles() {
            const prunable = getPrunableUpcomingArticles();
            console.log(`[WikiFlow] Purging ${prunable.length} articles beyond protected lookahead zone.`);
            prunable.forEach(card => {
                dwellObserver.unobserve(card);
                card.remove();
            });
        }

        async function realignFeedAfterPreferenceShift(newTopic = null) {
            purgeAllUpcomingArticles();
            if (newTopic) {
                preferredPool = [];
                const params = new URLSearchParams({ 
                    action: 'query', 
                    generator: 'categorymembers', 
                    gcmtitle: `Category:${newTopic}`, 
                    gcmnamespace: '0', 
                    gcmlimit: '18' 
                });
                const res = await fetchWikiData(params);
                res.forEach(item => {
                    item.sourceCategory = newTopic;
                    item.baseReason = `Because you explored: <b>${newTopic}</b>`;
                });
                const existingIds = new Set(discoveryPool.map(a => a.pageid));
                const unique = res.filter(item => !seenArticles.has(item.pageid) && !existingIds.has(item.pageid));
                preferredPool.push(...unique);
            }
            await ensureDOMBuffer();
            replenishCandidatePool();
        }

        // --- Article Click Handler ---
        window.handleReadClick = async function(url, categoriesStr, title, pageid) {
            let cats = [];
            try { 
                cats = JSON.parse(decodeURIComponent(categoriesStr)); 
            } catch(e) {}

            if (!cats || cats.length === 0) {
                console.warn(`[WikiFlow] Categories empty for "${title}" on click. Resolving canonical categories via API with redirects...`);
                const liveCats = await getArticleCategories(title, pageid);
                cats = liveCats.map(c => c.replace(/^Category:/i, '').trim()).filter(c => !isIgnoredCategory(c));
            }

            if (!cats || cats.length === 0) {
                cats = [title.trim()];
            }

            console.log(`[WikiFlow] Verified Card Click: "${title}". Awarding +${CONFIG.POINTS_READ_CLICK} score bonus.`);
            console.log(`[WikiFlow] Categories credited:`, cats);
            updateCategoryScores(cats, CONFIG.POINTS_READ_CLICK);

            realignFeedAfterPreferenceShift(cats[0]);
            window.open(url, '_blank');
        };

        // --- Card Generation: Uniform Framing & Direct Click ---
        function createArticleCard(articleData) {
            const { article, cleanCats, reason } = articleData;
            markArticleSeen(article.pageid); 

            const card = document.createElement('div');
            card.className = `article-card ${article.thumbnail ? 'has-image' : 'no-image'}`;
            card.dataset.categories = JSON.stringify(cleanCats);
            card.dataset.primaryCategory = cleanCats.length > 0 ? cleanCats[0] : '';
            card.dataset.reason = reason; 
            card.dataset.title = article.title;
            const encodedCats = encodeURIComponent(JSON.stringify(cleanCats));
            const safeTitle = article.title.replace(/'/g, "\\'");
            const extract = article.extract ? article.extract.trim() : '';
            const url = `https://en.wikipedia.org/?curid=${article.pageid}`;
            
            // Detect portrait vs landscape ratio for uniform frame selection
            let orientationClass = 'landscape';
            if (article.thumbnail && article.thumbnail.height && article.thumbnail.width) {
                if (article.thumbnail.height > article.thumbnail.width * 1.15) {
                    orientationClass = 'portrait';
                }
            }

            const initial = (article.title.replace(/^The\s+/i, '').charAt(0) || 'W').toUpperCase();
            const categoryTag = cleanCats.length > 0 ? cleanCats[0] : 'Wikipedia';
            const fallbackHeroHtml = `
                <div class="article-fallback-hero" onclick="handleReadClick('${url}', '${encodedCats}', '${safeTitle}', '${article.pageid}')" title="Click to read article" role="button" tabindex="0">
                    <div class="fallback-hero-glow"></div>
                    <div class="fallback-hero-badge">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                        </svg>
                        <span class="truncate">${categoryTag}</span>
                    </div>
                    <div class="fallback-hero-initial title-font">${initial}</div>
                </div>
            `;

            let heroSectionHtml = '';
            if (article.thumbnail) {
                heroSectionHtml = `
                    <img src="${article.thumbnail.source}" alt="${article.title}" crossorigin="anonymous" class="article-img ${orientationClass}" onclick="handleReadClick('${url}', '${encodedCats}', '${safeTitle}', '${article.pageid}')" title="Click to read article">
                    ${fallbackHeroHtml}
                `;
            } else {
                heroSectionHtml = fallbackHeroHtml;
            }

            const hue = Math.floor(Math.random() * 360);
            
            card.innerHTML = `
                <div class="article-bg" style="--article-h: ${hue}; --article-s: 40%;"></div>
                <div class="article-content">
                    ${heroSectionHtml}
                    <h1 class="article-title title-font text-shadow">${article.title}</h1>
                    <p class="article-extract text-shadow">${extract}</p>
                </div>
            `;

            if (article.thumbnail) {
                extractColorFromImage(article.thumbnail.source, (hsl) => {
                    const bg = card.querySelector('.article-bg');
                    const finalSat = Math.min(hsl[1], 60);
                    bg.style.setProperty('--article-h', hsl[0]);
                    bg.style.setProperty('--article-s', finalSat + '%');
                });

                // Guarantee orientation frame matches actual rendered dimensions
                const imgEl = card.querySelector('.article-img');
                if (imgEl) {
                    imgEl.onload = () => {
                        if (imgEl.naturalHeight > imgEl.naturalWidth * 1.15) {
                            imgEl.classList.remove('landscape');
                            imgEl.classList.add('portrait');
                        } else {
                            imgEl.classList.remove('portrait');
                            imgEl.classList.add('landscape');
                        }
                    };
                }
            }

            return card;
        }

        // --- Diversity-Aware Queue Scheduler ---
        async function ensureDOMBuffer() {
            if (isLoading) return;
            const aheadCount = getUpcomingArticles().length;
            const needed = CONFIG.DOM_BUFFER_TARGET - aheadCount;

            if (needed <= 0) return;

            const totalInPool = preferredPool.length + discoveryPool.length;
            if (totalInPool < needed) {
                isLoading = true;
                await replenishCandidatePool();
                isLoading = false;
            }

            const profile = getProfile();
            const topCategories = getTopCategories(5);

            let preferredRatio = CONFIG.FEED_RATIO_PREFERRED;
            if (topCategories.length <= 1) {
                preferredRatio = 1;
            } else if (topCategories.length === 2) {
                preferredRatio = 2;
            }

            const scoredPreferred = preferredPool
                .map(art => scoreArticleByIntersection(art, profile))
                .sort((a, b) => b.score - a.score);

            const scoredDiscovery = discoveryPool
                .map(art => scoreArticleByIntersection(art, profile))
                .sort((a, b) => b.score - a.score);

            let chosen = [];
            let lastCat = currentActiveCard ? (currentActiveCard.dataset.primaryCategory || '') : '';

            for (let i = 0; i < needed; i++) {
                const wantPreferred = topCategories.length > 0 && ((i % (preferredRatio + 1)) < preferredRatio);
                let selectedArticle = null;

                if (wantPreferred && scoredPreferred.length > 0) {
                    const nonClumpIdx = scoredPreferred.findIndex(c => {
                        const prim = (c.cleanCats && c.cleanCats.length > 0) ? c.cleanCats[0] : '';
                        return prim !== lastCat;
                    });
                    const idx = nonClumpIdx !== -1 ? nonClumpIdx : 0;
                    selectedArticle = scoredPreferred.splice(idx, 1)[0];
                } else if (scoredDiscovery.length > 0) {
                    selectedArticle = scoredDiscovery.shift();
                } else if (scoredPreferred.length > 0) {
                    selectedArticle = scoredPreferred.shift();
                }

                if (selectedArticle) {
                    chosen.push(selectedArticle);
                    lastCat = (selectedArticle.cleanCats && selectedArticle.cleanCats.length > 0) ? selectedArticle.cleanCats[0] : '';
                    
                    for (let cat in topicCooldowns) {
                        if (topicCooldowns[cat] > 0) topicCooldowns[cat]--;
                        if (topicCooldowns[cat] <= 0) delete topicCooldowns[cat];
                    }
                }
            }

            if (chosen.length === 0) {
                if (isWaitingAtBottom) showLoading();
                return;
            }

            const chosenIds = new Set(chosen.map(c => c.article.pageid));
            preferredPool = preferredPool.filter(art => !chosenIds.has(art.pageid));
            discoveryPool = discoveryPool.filter(art => !chosenIds.has(art.pageid));

            chosen.forEach(articleData => {
                const card = createArticleCard(articleData);
                container.insertBefore(card, trigger);
                dwellObserver.observe(card);
            });

            if (getUpcomingArticles().length > 0 && isWaitingAtBottom) {
                isWaitingAtBottom = false;
                hideLoading();
            }

            if (preferredPool.length + discoveryPool.length < CONFIG.POOL_MIN_TRIGGER) {
                replenishCandidatePool();
            }
        }

        // --- Mobile Touch & Boundary Gesture Detection ---
        let touchStartY = 0;
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                const deltaY = touchStartY - e.touches[0].clientY;
                if (deltaY > 15 && getUpcomingArticles().length === 0) {
                    if (!isWaitingAtBottom) {
                        isWaitingAtBottom = true;
                        console.log("[WikiFlow] Mobile swipe at boundary: Freezing dwell timer on current card.");
                    }
                    showLoading("Loading...");
                    ensureDOMBuffer();
                } else if (deltaY < -15 && isWaitingAtBottom) {
                    isWaitingAtBottom = false;
                    hideLoading();
                }
            }
        }, { passive: true });

        container.addEventListener('scroll', () => {
            const distanceToBottom = container.scrollHeight - container.scrollTop - container.clientHeight;
            if (distanceToBottom <= 15 && getUpcomingArticles().length === 0) {
                if (!isWaitingAtBottom) {
                    isWaitingAtBottom = true;
                    console.log("[WikiFlow] Boundary reached at feed bottom: Freezing dwell timer.");
                }
                showLoading("Loading...");
                ensureDOMBuffer();
            } else if (distanceToBottom > 40 && isWaitingAtBottom) {
                isWaitingAtBottom = false;
                hideLoading();
            }
        }, { passive: true });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeSearch();
                settingsOverlay.style.display = 'none';
                return;
            }

            if (settingsOverlay.style.display !== 'none' || searchOverlay.style.display !== 'none') return;

            if (['ArrowDown', 'PageDown', ' '].includes(e.key) && getUpcomingArticles().length === 0) {
                isWaitingAtBottom = true;
                showLoading("Loading...");
                ensureDOMBuffer();
            }
        });

        window.addEventListener('blur', () => {
            isWindowFocused = false;
        });

        window.addEventListener('focus', () => {
            isWindowFocused = true;
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log("[WikiFlow] Document hidden: Dwell accumulation halted.");
            } else {
                console.log("[WikiFlow] Document visible: Dwell accumulation active.");
            }
        });

        scrollObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                ensureDOMBuffer();
            }
        }, { root: container, rootMargin: '0px 0px 400px 0px' });

        // Dwell Observer: Monitors attention, handles fatigue skips & ahead buffering
        dwellObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    if (dwellInterval) clearInterval(dwellInterval);
                    activeDwellTime = 0;
                    currentActiveCard = entry.target;
                    isWaitingAtBottom = false;
                    hideLoading();
                    
                    const title = entry.target.dataset.title || "Article";
                    suggestionReasonText.innerHTML = entry.target.dataset.reason || "Exploration: Broadening your horizons";

                    try { activeCategories = JSON.parse(entry.target.dataset.categories || "[]"); } 
                    catch(e) { activeCategories = []; }

                    console.log(`[WikiFlow] Viewing: "${title}".`);

                    ensureDOMBuffer();

                    dwellInterval = setInterval(() => {
                        if (!isUserActivelyReading()) return;

                        activeDwellTime += 0.5;
                        if (activeDwellTime >= CONFIG.DWELL_MIN_ACTIVE_SEC) {
                            const points = activeDwellTime > CONFIG.DWELL_LONG_THRESHOLD_SEC ? CONFIG.POINTS_DWELL_LONG_TICK : CONFIG.POINTS_DWELL_TICK;
                            updateCategoryScores(activeCategories, points);
                            if (activeDwellTime % 2 === 0) {
                                console.log(`[WikiFlow] Dwelling on "${title}" (${activeDwellTime}s) -> +${points} pts to:`, activeCategories);
                            }
                        }
                    }, CONFIG.DWELL_TICK_INTERVAL_MS);
                } else {
                    const title = entry.target.dataset.title || "Article";
                    
                    if (activeDwellTime > 0 && activeDwellTime < CONFIG.QUICK_SKIP_THRESHOLD_SEC) {
                        try {
                            const exitingCats = JSON.parse(entry.target.dataset.categories || "[]");

                            exitingCats.forEach(cat => {
                                consecutiveTopicSkips[cat] = (consecutiveTopicSkips[cat] || 0) + 1;
                                console.log(`[WikiFlow] Quick skip on "${cat}" (Streak: ${consecutiveTopicSkips[cat]})`);

                                if (consecutiveTopicSkips[cat] >= CONFIG.FATIGUE_CONSECUTIVE_SKIPS) {
                                    applyTopicFatigue(cat);
                                }
                            });
                        } catch(e) {}
                    } else if (activeDwellTime >= CONFIG.DWELL_MIN_ACTIVE_SEC) {
                        activeCategories.forEach(cat => {
                            delete consecutiveTopicSkips[cat];
                        });
                    }

                    try {
                        const exitingCats = JSON.parse(entry.target.dataset.categories || "[]");
                        if (JSON.stringify(exitingCats) === JSON.stringify(activeCategories)) {
                            clearInterval(dwellInterval);
                            dwellInterval = null;
                        }
                    } catch(e) {}
                }
            });
        }, { root: container, threshold: 0.6 });

        window.addEventListener('DOMContentLoaded', async () => {
            console.log("[WikiFlow] App initialized. Version 1.0 ready.");
            loadSettings(); 
            clearStatsBtn.addEventListener('click', () => {
                localStorage.removeItem('wikiFlowProfile');
                localStorage.removeItem('wikiReelsProfile');
                consecutiveTopicSkips = {};
                topicCooldowns = {};
                console.log("[WikiFlow] Profile cleared: Memory wiped.");
                renderDebug();
            });
            scrollObserver.observe(trigger);
            
            showLoading("Loading...");
            await replenishCandidatePool();
            await ensureDOMBuffer();
            hideLoading();
        });
    </script>
</body>
</html>
